{% extends "base.html" %}
{% block title %}Discover{% endblock %}
{% block content %}

<div class="deck-screen">
  <div class="deck-stage" id="deckStage">
    <div class="deck-card" id="deckCard" data-deck-card>
      <img class="deck-img" id="deckImg" alt="" />
      <div class="deck-meta">
        <div class="deck-badges">
          <span class="deck-type" id="deckType"></span>
          <span class="deck-genre" id="deckGenre" hidden></span>
        </div>
        <h2 class="deck-title" id="deckTitle">Loading…</h2>
        <div class="deck-submeta" id="deckSubmeta"></div>
        <p class="deck-overview" id="deckOverview"></p>
      </div>
    </div>
    <div class="deck-overlay deck-overlay--like" id="likeBadge" aria-label="Save">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <div class="deck-overlay deck-overlay--nope" id="nopeBadge" aria-label="Skip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </div>
    <div class="deck-empty" id="deckEmpty" hidden>
      <span class="deck-empty-icon">🍿</span>
      <p>Couldn't load a title. Tap to try again.</p>
    </div>
  </div>
  <p class="deck-hint">← Swipe left to skip · Swipe right to save →</p>
</div>

<style>
  /* Immersive deck: fill the screen, no footer/scroll on this page */
  .footer { display: none; }
  html, body { overflow: hidden; overscroll-behavior: none; height: 100%; }
  .deck-screen {
    max-width: 460px;
    margin: 0 auto;
    padding: 14px 16px 10px;
    display: flex;
    flex-direction: column;
    height: calc(100dvh - 60px);
  }
  .deck-stage { position: relative; flex: 1 1 auto; min-height: 0; }
  .deck-card {
    position: absolute;
    inset: 0;
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    will-change: transform;
    user-select: none;
    cursor: grab;
  }
  .deck-img {
    width: 100%;
    flex: 0 0 50%;       /* smaller poster -> more room for text */
    min-height: 0;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }
  .deck-meta {
    flex: 1 1 auto;
    min-height: 0;
    padding: 12px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .deck-badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .deck-type, .deck-genre {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    border-radius: var(--radius-pill);
    padding: 2px 10px;
  }
  .deck-type { color: var(--green-dark); background: var(--green-light); }
  .deck-genre { color: var(--text-muted); background: #eef1ec; border: 1px solid var(--border); }
  .deck-genre[hidden] { display: none; }
  .deck-title { font-size: 19px; font-weight: 800; color: var(--text); line-height: 1.2; }
  .deck-submeta { font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .deck-overview {
    font-size: 13.5px; color: var(--text-muted); line-height: 1.55;
    flex: 1 1 auto; min-height: 0; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical;
  }
  .deck-overlay {
    position: absolute;
    top: 20px;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    opacity: 0;
    transition: opacity .12s;
    pointer-events: none;
    box-shadow: 0 2px 12px rgba(0,0,0,.3);
    z-index: 3;
  }
  .deck-overlay svg { width: 38px; height: 38px; }
  .deck-overlay--like { right: 20px; background: #2e9e4f; }
  .deck-overlay--nope { left: 20px; background: #e0414e; }
  .deck-hint {
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,.8);
    margin-top: 12px;
    user-select: none;
  }
  .deck-empty {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; cursor: pointer;
    background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border);
  }
  /* the hidden attribute must beat display:flex, or the overlay covers the card */
  .deck-empty[hidden] { display: none; }
  .deck-empty-icon { font-size: 44px; }
  .deck-empty p { color: var(--text-muted); font-size: 14px; }
</style>

<script>
  (function () {
    var card = document.getElementById('deckCard');
    var img = document.getElementById('deckImg');
    var typeEl = document.getElementById('deckType');
    var genreEl = document.getElementById('deckGenre');
    var submetaEl = document.getElementById('deckSubmeta');
    var titleEl = document.getElementById('deckTitle');
    var overviewEl = document.getElementById('deckOverview');
    var likeBadge = document.getElementById('likeBadge');
    var nopeBadge = document.getElementById('nopeBadge');
    var emptyEl = document.getElementById('deckEmpty');

    var current = null;   // data shown on the card
    var nextData = null;  // prefetched next
    var busy = false;
    var startX = 0, startY = 0, dx = 0, dy = 0, dragging = false;
    var vw = function () { return window.innerWidth; };

    function fetchPick(tries) {
      tries = tries == null ? 3 : tries;
      return fetch('/api/random_pick', { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
        .then(function (r) {
          // Session expired -> the API redirected us to the login page (HTML).
          // Send the user to log in instead of silently failing.
          if (r.redirected && r.url.indexOf('/login') > -1) { window.location.href = '/login'; return { __redirect: true }; }
          var ct = r.headers.get('content-type') || '';
          if (ct.indexOf('application/json') === -1) { window.location.href = '/login'; return { __redirect: true }; }
          return r.json();
        })
        .then(function (d) {
          if (d && d.__redirect) return null;
          if (d && d.ok) return d;
          return tries > 1 ? fetchPick(tries - 1) : null;
        })
        .catch(function () { return tries > 1 ? fetchPick(tries - 1) : null; });
    }

    var retryTimer = null;
    function render(d) {
      if (!d) {
        emptyEl.hidden = false;
        card.style.display = 'none';
        // self-heal: auto-retry a few seconds later so a transient miss isn't a dead end
        if (retryTimer) clearTimeout(retryTimer);
        retryTimer = setTimeout(function () { busy = false; advance(); }, 3000);
        return;
      }
      if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
      emptyEl.hidden = true;
      card.style.display = 'flex';
      // snap instantly to center, invisible — no transition so it doesn't slide back in
      card.style.transition = 'none';
      card.style.transform = 'none';
      card.style.opacity = '0';
      likeBadge.style.opacity = '0';
      nopeBadge.style.opacity = '0';
      // load new content
      img.src = d.image;
      img.alt = d.title;
      typeEl.textContent = d.media_type === 'tv' ? 'TV Show' : 'Movie';
      if (d.genre) { genreEl.textContent = d.genre; genreEl.hidden = false; }
      else { genreEl.hidden = true; }
      titleEl.textContent = d.title;
      var bits = [];
      if (d.year) bits.push(d.year);
      if (d.rating) bits.push('★ ' + d.rating);
      submetaEl.textContent = bits.join('  ·  ');
      overviewEl.textContent = d.overview || '';
      // force reflow so the reset above paints before we re-enable transitions
      void card.offsetWidth;
      // fade in at center (no slide)
      card.style.transition = 'opacity .18s ease';
      card.style.opacity = '1';
    }

    function prefetch() {
      fetchPick().then(function (d) {
        nextData = d;
        if (d && d.image) { var im = new Image(); im.src = d.image; } // preload so the next card is instant
      });
    }

    function advance() {
      busy = true;
      if (nextData) { current = nextData; nextData = null; render(current); prefetch(); busy = false; }
      else {
        fetchPick().then(function (d) { current = d; render(current); prefetch(); busy = false; });
      }
    }

    function save(d) {
      if (!d) return;
      fetch('/api/save_favorite', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: d.title, image: d.image })
      }).catch(function () {});
    }

    function fling(dir) {
      if (busy || !current) return;
      if (dir > 0) save(current);
      card.style.transition = 'transform .3s ease, opacity .3s ease';
      card.style.transform = 'translateX(' + (dir * vw() * 1.4) + 'px) rotate(' + (dir * 18) + 'deg)';
      card.style.opacity = '0';
      setTimeout(advance, 290);
    }

    // pointer drag
    card.addEventListener('pointerdown', function (e) {
      if (busy) return;
      dragging = true; startX = e.clientX; startY = e.clientY; dx = 0; dy = 0;
      card.style.transition = 'none';
      if (card.setPointerCapture) { try { card.setPointerCapture(e.pointerId); } catch (_) {} }
    });
    card.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      dx = e.clientX - startX; dy = e.clientY - startY;
      card.style.transform = 'translateX(' + dx + 'px) translateY(' + (dy * 0.3) + 'px) rotate(' + (dx / 20) + 'deg)';
      likeBadge.style.opacity = dx > 30 ? String(Math.min(dx / 120, 1)) : '0';
      nopeBadge.style.opacity = dx < -30 ? String(Math.min(-dx / 120, 1)) : '0';
    });
    function release() {
      if (!dragging) return;
      dragging = false;
      var threshold = Math.min(110, vw() * 0.28);
      if (dx > threshold) fling(1);
      else if (dx < -threshold) fling(-1);
      else {
        card.style.transition = 'transform .25s ease';
        card.style.transform = '';
        likeBadge.style.opacity = '0';
        nopeBadge.style.opacity = '0';
      }
    }
    card.addEventListener('pointerup', release);
    card.addEventListener('pointercancel', release);
    card.style.touchAction = 'none';
    card.querySelectorAll('img').forEach(function (i) { i.draggable = false; });

    emptyEl.addEventListener('click', advance);

    // keyboard for desktop: left/right arrows
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') fling(-1);
      else if (e.key === 'ArrowRight') fling(1);
    });

    // initial load
    fetchPick().then(function (d) { current = d; render(current); prefetch(); });
  })();
</script>

{% endblock %}
