{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}

<div class="page" style="max-width:560px;">
  <h1>Hey, {{ current_user.first_name }} 👋</h1>
  <p class="text-center" style="margin-bottom:32px;">What do you want to do today?</p>

  <div class="home-grid">
    <a href="/movies" class="home-tile">
      <span class="tile-icon">🎥</span>
      <span class="tile-label">Movies</span>
    </a>
    <a href="/tvshows" class="home-tile">
      <span class="tile-icon">📺</span>
      <span class="tile-label">TV Shows</span>
    </a>
    <a href="/genre" class="home-tile">
      <span class="tile-icon">🎭</span>
      <span class="tile-label">Browse Genre</span>
    </a>
    <a href="/search" class="home-tile">
      <span class="tile-icon">🔍</span>
      <span class="tile-label">Search</span>
    </a>
    <a href="/favorites" class="home-tile">
      <span class="tile-icon">❤️</span>
      <span class="tile-label">My Playlst</span>
    </a>
    <a href="/group_hub" class="home-tile">
      <span class="tile-icon">👥</span>
      <span class="tile-label">Group Hub</span>
    </a>
    <a href="/watch" class="home-tile">
      <span class="tile-icon">▶️</span>
      <span class="tile-label">Watch</span>
    </a>
    <a href="/shared_favorites" class="home-tile home-tile--fire">
      <span class="tile-label">Matched Playlst</span>
    </a>
  </div>
</div>

<style>
  .home-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  @media (min-width: 480px) {
    .home-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .home-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 28px 16px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    color: var(--text);
    font-weight: 700;
    transition: box-shadow .15s, transform .15s, border-color .15s;
    text-align: center;
  }
  .home-tile:hover {
    box-shadow: var(--shadow);
    transform: translateY(-2px);
    border-color: var(--green);
    color: var(--green-dark);
  }
  .home-tile--fire { grid-column: span 2; }
  @media (min-width: 480px) { .home-tile--fire { grid-column: span 1; } }
  .tile-icon { font-size: 32px; line-height: 1; }
  .tile-label { font-size: 14px; font-weight: 700; }
</style>

{% endblock %}
