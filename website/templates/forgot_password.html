{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}

<div class="page-narrow">
  <h1>Forgot Password</h1>
  <p class="text-center" style="margin-bottom:24px;">
    Enter your email and we'll send you a link to reset your password.
  </p>

  <div class="card">
    <div class="card-body">
      <form method="POST">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg mt-16">Send Reset Link</button>
      </form>
    </div>
  </div>

  <p class="text-center mt-16" style="font-size:14px;">
    Remembered it? <a href="{{ url_for('auth.login') }}" style="font-weight:700;">Back to login</a>
  </p>
</div>

{% endblock %}
