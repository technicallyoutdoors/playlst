{% extends "base.html" %}
{% block title %}Join Group{% endblock %}
{% block content %}

<div class="page-narrow">
  <h1>Join a Group</h1>
  <p class="text-center" style="margin-bottom:32px;">Enter the 6-character code your group leader shared with you.</p>

  <div class="card">
    <div class="card-body">
      <form method="post" action="{{ url_for('auth.add_member') }}">
        <div class="form-group">
          <label for="code">Group Code</label>
          <input type="text" id="code" name="code" placeholder="e.g. AB12CD"
                 maxlength="6" style="text-transform:uppercase;letter-spacing:4px;font-size:22px;text-align:center;" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg mt-16">Join Group</button>
      </form>
    </div>
  </div>

  <p class="text-center mt-16" style="font-size:14px;">
    Don't have a code? <a href="{{ url_for('auth.group_hub') }}" style="font-weight:700;">Create your own group</a>
  </p>
</div>

{% endblock %}
