{% extends "base.html" %}
{% block title %}TV Shows{% endblock %}
{% block content %}

<div class="page" style="max-width:480px;">
  <h1>TV Shows 📺</h1>

  <div class="poster-wrap">
    <img src="{{ full_path_random_title_image }}" alt="{{ title }}" class="poster-img" />
    <div class="poster-meta">
      <h2 class="poster-title">{{ title }}</h2>
      <p class="poster-overview">{{ over_view }}</p>
    </div>
  </div>

  <div class="action-row">
    <form method="post" action="{{ url_for('auth.add_favorite_tv_show') }}">
      <input type="hidden" name="tv_show_title" value="{{ title }}" />
      <input type="hidden" name="tv_show_image_url" value="{{ full_path_random_title_image }}" />
      <input type="hidden" name="current_user" value="{{ current_user.id }}" />
      <button type="submit" class="btn btn-outline">+ Playlst</button>
    </form>
    <form method="post" action="{{ url_for('auth.tvshows') }}">
      <button type="submit" class="btn btn-primary">Next ›</button>
    </form>
  </div>
</div>

<style>
  .poster-wrap {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .poster-img {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    display: block;
  }
  .poster-meta { padding: 16px 18px 20px; }
  .poster-title {
    font-size: 20px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 8px;
  }
  .poster-overview {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .action-row {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    justify-content: center;
  }
  .action-row form { margin: 0; }
</style>

{% endblock %}
