{% extends "base.html" %}
{% block title %}Movies{% endblock %}
{% block content %}

<div class="poster-screen">
  <h1>Movies 🎥</h1>

  <div class="poster-wrap" data-swipe>
    <img src="{{ full_path_random_title_image }}" alt="{{ title }}" class="poster-img" />
    <div class="poster-meta">
      <h2 class="poster-title">{{ title }}</h2>
      <p class="poster-overview">{{ full_overview }}</p>
    </div>
  </div>

  <div class="action-row">
    <form method="post" action="{{ url_for('auth.add_favorite_movie') }}">
      <input type="hidden" name="movie_title" value="{{ title }}" />
      <input type="hidden" name="movie_image_url" value="{{ full_path_random_title_image }}" />
      <input type="hidden" name="current_user" value="{{ current_user.id }}" />
      <button type="submit" class="btn btn-primary">+ Playlst</button>
    </form>
  </div>
  <p class="swipe-hint">← Swipe the poster to see the next title →</p>

  <!-- Submitted by the swipe gesture -->
  <form method="post" action="{{ url_for('auth.movies') }}" data-next-form hidden></form>
</div>

{% endblock %}
