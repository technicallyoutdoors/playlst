{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}

<div class="page-narrow">
  <div class="auth-logo">
    <img src="{{ url_for('static', filename='brand_images/playlst_logo.png') }}" alt="Playlst" />
  </div>

  <div class="card" style="margin-top:24px;">
    <div class="card-body">
      <h2 class="text-center" style="margin-bottom:24px;">Welcome back</h2>
      <form method="POST">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg mt-16">Login</button>
      </form>

      <div class="oauth-divider"><span>or continue with</span></div>
      <div class="oauth-buttons">
        <a href="{{ url_for('oauth_bp.google_login') }}" class="oauth-btn">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.2 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 40.4 44 35 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
          Continue with Google
        </a>
      </div>
    </div>
  </div>

  <p class="text-center mt-16" style="font-size:14px;">
    Don't have an account? <a href="/signup" style="font-weight:700;">Sign up</a>
  </p>
</div>

<style>
  .auth-logo { display: flex; justify-content: center; }
  .auth-logo img { height: 48px; width: auto; }
  .oauth-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0 16px;
    color: var(--text-muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .oauth-divider::before, .oauth-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .oauth-buttons { display: flex; gap: 10px; }
  .oauth-btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-pill);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    transition: border-color .15s, background .15s;
  }
  .oauth-btn:hover { border-color: var(--green); background: var(--green-pale); color: var(--text); }
</style>

{% endblock %}
