{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}

<div class="page-narrow">
  <h1>Reset Password</h1>
  <p class="text-center" style="margin-bottom:24px;">Choose a new password for your account.</p>

  <div class="card">
    <div class="card-body">
      <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
        <div class="form-group">
          <label for="password1">New Password</label>
          <input type="password" id="password1" name="password1" placeholder="At least 8 characters" required />
        </div>
        <div class="form-group">
          <label for="password2">Confirm New Password</label>
          <input type="password" id="password2" name="password2" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg mt-16">Update Password</button>
      </form>
    </div>
  </div>
</div>

{% endblock %}
